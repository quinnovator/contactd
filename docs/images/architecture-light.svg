<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-label="Clients send messages to the contactd API, which routes each one to that contact's actor. When the person stops typing, the actor runs a turn: recall past episodes with local models, plan a cache-friendly prompt, call the model provider, and run code in a sandbox if asked. Every event is appended to one SQLite log, which recall reads back.">
<title>Clients send messages to the contactd API, which routes each one to that contact's actor. When the person stops typing, the actor runs a turn: recall past episodes with local models, plan a cache-friendly prompt, call the model provider, and run code in a sandbox if asked. Every event is appended to one SQLite log, which recall reads back.</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 13px; }
  .b { font-weight: 600; }
  .s { fill: #59636e; font-size: 11.5px; }
  .lab { fill: #59636e; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
  .acc { fill: #c4562c; }
  .h { font-weight: 700; font-size: 14px; }
  .bg { fill: #ffffff; }
  .box { fill: #ffffff; stroke: #c3c9d4; stroke-width: 1.25; }
  .box-acc { fill: #ffffff; stroke: #c4562c; stroke-width: 1.5; }
  .panel { fill: #fbe9e1; stroke: #c4562c; stroke-width: 1.25; }
  .idle { fill: none; stroke: #c3c9d4; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .fence { fill: none; stroke: #59636e; stroke-width: 1; stroke-dasharray: 2 5; }
  .wire { stroke: #59636e; stroke-width: 1.4; fill: none; }
  .wire-acc { stroke: #c4562c; stroke-width: 1.6; fill: none; }
  .cell { fill: #c3c9d4; }
  .cell-new { fill: #c4562c; }
  .tier { fill: #fbe9e1; stroke: #c4562c; stroke-width: 1.25; }
  .tier-live { fill: #ffffff; stroke: #c3c9d4; stroke-width: 1.25; }
  .arrowhead { fill: #59636e; }
  .arrowhead-acc { fill: #c4562c; }
</style>
<rect class="bg" x="0" y="0" width="1240" height="470"/>
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" class="arrowhead"/>
            </marker>
            <marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" class="arrowhead-acc"/>
            </marker>
          </defs>

          <!-- The process boundary -->
          <rect class="fence" x="205" y="16" width="825" height="436" rx="14"/>
          <text class="lab" x="222" y="36">contactd · one Go binary</text>

          <!-- Clients -->
          <rect class="box" x="20" y="70" width="140" height="64" rx="8"/>
          <text class="b" x="90" y="97" text-anchor="middle">Terminal client</text>
          <text class="lab" x="90" y="116" text-anchor="middle">contactd chat</text>
          <rect class="box" x="20" y="160" width="140" height="64" rx="8"/>
          <text class="b" x="90" y="187" text-anchor="middle">Any HTTP client</text>
          <text class="lab" x="90" y="206" text-anchor="middle">curl, your app</text>

          <line class="wire" x1="160" y1="92" x2="228" y2="92" marker-end="url(#ah)"/>
          <line class="wire" x1="230" y1="112" x2="162" y2="112" marker-end="url(#ah)"/>
          <text class="lab" x="182" y="86" text-anchor="middle">send</text>
          <text class="lab" x="182" y="128" text-anchor="middle">stream</text>
          <line class="wire" x1="160" y1="182" x2="228" y2="182" marker-end="url(#ah)"/>
          <line class="wire" x1="230" y1="202" x2="162" y2="202" marker-end="url(#ah)"/>

          <!-- API -->
          <rect class="box" x="230" y="70" width="120" height="154" rx="8"/>
          <text class="b" x="290" y="124" text-anchor="middle">API</text>
          <text class="s" x="290" y="144" text-anchor="middle">HTTP · SSE</text>
          <text class="s" x="290" y="160" text-anchor="middle">WebSocket</text>
          <text class="s" x="290" y="176" text-anchor="middle">Unix socket</text>

          <line class="wire" x1="350" y1="90" x2="418" y2="90" marker-end="url(#ah)"/>
          <line class="wire" x1="350" y1="138" x2="418" y2="138" marker-end="url(#ah)"/>
          <text class="lab" x="385" y="84" text-anchor="middle">routes</text>

          <!-- Actors -->
          <text class="h" x="490" y="58" text-anchor="middle">Contact actors</text>
          <rect class="box-acc" x="420" y="70" width="140" height="40" rx="8"/>
          <text x="490" y="95" text-anchor="middle"><tspan class="b">ada</tspan><tspan class="s" dx="6">replying</tspan></text>
          <rect class="box" x="420" y="118" width="140" height="40" rx="8"/>
          <text x="490" y="143" text-anchor="middle"><tspan class="b">bo</tspan><tspan class="s" dx="6">waiting</tspan></text>
          <rect class="idle" x="420" y="166" width="140" height="58" rx="8"/>
          <text class="s" x="490" y="190" text-anchor="middle">idle contacts</text>
          <text class="s" x="490" y="208" text-anchor="middle">asleep, no memory</text>
          <text class="lab" x="490" y="244" text-anchor="middle">one goroutine per active contact</text>

          <line class="wire-acc" x1="560" y1="90" x2="628" y2="90" marker-end="url(#ah-acc)"/>
          <text class="lab acc" x="595" y="108" text-anchor="middle">after a</text>
          <text class="lab acc" x="595" y="121" text-anchor="middle">pause</text>

          <!-- One turn -->
          <rect class="panel" x="630" y="40" width="180" height="270" rx="12"/>
          <text class="h acc" x="720" y="63" text-anchor="middle">One turn</text>

          <rect class="box" x="642" y="76" width="156" height="46" rx="7"/>
          <text class="b" x="720" y="96" text-anchor="middle">1 · Recall</text>
          <text class="s" x="720" y="113" text-anchor="middle">up to 4 past episodes</text>

          <rect class="box" x="642" y="132" width="156" height="46" rx="7"/>
          <text class="b" x="720" y="152" text-anchor="middle">2 · Plan the prompt</text>
          <text class="s" x="720" y="169" text-anchor="middle">5 tiers, cache first</text>

          <rect class="box" x="642" y="188" width="156" height="46" rx="7"/>
          <text class="b" x="720" y="208" text-anchor="middle">3 · Call the model</text>
          <text class="s" x="720" y="225" text-anchor="middle">stream the reply</text>

          <rect class="box" x="642" y="244" width="156" height="46" rx="7"/>
          <text class="b" x="720" y="264" text-anchor="middle">4 · Run code</text>
          <text class="s" x="720" y="281" text-anchor="middle">only when the model asks</text>

          <!-- In-process helpers -->
          <rect class="box" x="880" y="76" width="130" height="46" rx="7"/>
          <text class="b" x="945" y="96" text-anchor="middle">Local models</text>
          <text class="s" x="945" y="113" text-anchor="middle">embed · rerank</text>
          <line class="wire" x1="798" y1="99" x2="878" y2="99" marker-end="url(#ah)"/>
          <text class="lab" x="839" y="93" text-anchor="middle">rank</text>

          <rect class="box" x="880" y="244" width="130" height="46" rx="7"/>
          <text class="b" x="945" y="264" text-anchor="middle">Sandbox</text>
          <text class="s" x="945" y="281" text-anchor="middle">Python, JS in WASM</text>
          <line class="wire" x1="798" y1="267" x2="878" y2="267" marker-end="url(#ah)"/>
          <text class="lab" x="839" y="261" text-anchor="middle">code</text>

          <!-- Model provider, outside the binary -->
          <rect class="box" x="1090" y="178" width="130" height="64" rx="8"/>
          <text class="b" x="1155" y="202" text-anchor="middle">Model provider</text>
          <text class="s" x="1155" y="219" text-anchor="middle">DeepSeek, Claude,</text>
          <text class="s" x="1155" y="234" text-anchor="middle">OpenRouter, …</text>
          <line class="wire" x1="798" y1="203" x2="1088" y2="203" marker-end="url(#ah)"/>
          <line class="wire" x1="1090" y1="220" x2="800" y2="220" marker-end="url(#ah)"/>
          <text class="lab" x="945" y="197" text-anchor="middle">prompt</text>
          <text class="lab" x="945" y="236" text-anchor="middle">reply, cache hits</text>

          <!-- The event log -->
          <rect class="box" x="230" y="370" width="780" height="64" rx="8"/>
          <text class="b" x="250" y="396">Event log <tspan class="s" dx="4">SQLite</tspan></text>
          <text class="s" x="250" y="416">append-only · the only stored state</text>
          <g>
            <rect class="cell" x="560" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="580" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="600" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="620" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="640" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="660" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="680" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="700" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="720" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="740" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="760" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="780" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="800" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="820" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="840" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="860" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="880" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="900" y="386" width="16" height="32" rx="2"/>
            <rect class="cell" x="920" y="386" width="16" height="32" rx="2"/>
            <rect class="cell-new" x="940" y="386" width="16" height="32" rx="2"/>
          </g>
          <text class="lab" x="964" y="406">newest</text>

          <line class="wire" x1="490" y1="256" x2="490" y2="368" marker-end="url(#ah)"/>
          <text class="lab" x="498" y="318">appends every event</text>
          <line class="wire" x1="720" y1="368" x2="720" y2="312" marker-end="url(#ah)"/>
          <text class="lab" x="728" y="344">recall reads</text>
        </svg>
