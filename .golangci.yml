version: "2"
run:
  # ORT is Hugot's own tag for its ONNX Runtime backend; our adapter reuses it.
  build-tags: [ORT, integration]
  relative-path-mode: gomod
formatters:
  enable: [gofumpt, gci]
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      sections: [standard, default, localmodule]
linters:
  default: none
  enable:
    - depguard
    - forbidigo
    - containedctx
    - contextcheck
    - noctx
    - errcheck
    - errorlint
    - nilerr
    - wrapcheck
    - sloglint
    - gochecknoglobals
    - gochecknoinits
    - exhaustive
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - musttag
    - gosec
    - paralleltest
    - tparallel
    - thelper
    - usetesting
    - modernize
    - intrange
    - perfsprint
    - prealloc
    - nolintlint
  settings:
    depguard:
      rules:
        domain-stays-pure:
          files:
            - "**/internal/core/**"
            - "**/internal/actor/**"
            - "**/internal/turn/**"
            - "**/internal/recall/**"
            - "**/internal/plan/**"
            # Tests may import the fakes that live beside the adapters
            # (infer/fake, llm/fake) and a real event log; rule 10 depends on it.
            - "!$test"
          deny:
            - pkg: database/sql
              desc: domain code talks to storage through ports
            - pkg: net/http
              desc: HTTP belongs in api/ and adapters
            - pkg: github.com/knights-analytics/hugot
              desc: inference goes through recall.Embedder / recall.Reranker
            - pkg: github.com/tetratelabs/wazero
              desc: execution goes through turn.EnvLeaser
            - pkg: github.com/quinnovator/contactd/internal/eventlog
              desc: adapters are wired in cmd/contactd only
            - pkg: github.com/quinnovator/contactd/internal/infer
              desc: adapters are wired in cmd/contactd only
            # internal/llm itself is the contract and is importable; its
            # codecs, provider profiles and fakes are not.
            - pkg: github.com/quinnovator/contactd/internal/llm/wire
              desc: wire codecs are reached through llm.Provider
            - pkg: github.com/quinnovator/contactd/internal/llm/provider
              desc: provider profiles are wired in cmd/contactd only
            - pkg: github.com/quinnovator/contactd/internal/llm/fake
              desc: fakes are for tests and cmd wiring
            - pkg: github.com/quinnovator/contactd/internal/llm/conform
              desc: the conformance suite is for provider tests
            - pkg: github.com/quinnovator/contactd/internal/env
              desc: adapters are wired in cmd/contactd only
            - pkg: github.com/quinnovator/contactd/internal/api
              desc: nothing imports the API layer
        # The provider boundary, from both sides. The contract knows the
        # core's data types and nothing else of ours; codecs and profiles
        # know the contract and never the core that drives them.
        llm-contract-is-a-leaf:
          files:
            - "**/internal/llm/*.go"
            - "!$test"
          deny:
            - pkg: github.com/quinnovator/contactd/internal/llm/
              desc: the contract holds no wire code and names no provider
            - pkg: github.com/quinnovator/contactd/internal/turn
              desc: the contract does not know the turn loop
            - pkg: github.com/quinnovator/contactd/internal/actor
              desc: the contract does not know the actors
            - pkg: net/http/httptest
              desc: the contract does no I/O
        providers-never-see-the-core:
          files:
            - "**/internal/llm/wire/**"
            - "**/internal/llm/provider/**"
            - "**/internal/llm/probe/**"
            - "**/internal/llm/conform/**"
          deny:
            - pkg: github.com/quinnovator/contactd/internal/turn
              desc: a provider is handed a plan and options, and nothing else
            - pkg: github.com/quinnovator/contactd/internal/actor
              desc: a provider is handed a plan and options, and nothing else
            - pkg: github.com/quinnovator/contactd/internal/eventlog
              desc: a provider never reads the log
            - pkg: github.com/quinnovator/contactd/internal/api
              desc: nothing imports the API layer
            - pkg: github.com/quinnovator/contactd/internal/config
              desc: profiles take their own Config; cmd/contactd maps the deployment's onto it
        # The terminal client is a client. It reaches the server over the
        # API, through internal/client, and never through what the server is
        # made of: a second process writing a contact's log would break it.
        chat-is-a-client:
          files:
            - "**/internal/client/**"
            - "**/internal/transcript/**"
            - "**/internal/tui/**"
            - "!$test"
          deny:
            - pkg: database/sql
              desc: the client reads the log through the API
            - pkg: github.com/quinnovator/contactd/internal/eventlog
              desc: the client reads the log through the API
            - pkg: github.com/quinnovator/contactd/internal/actor
              desc: the client talks to actors through the API
            - pkg: github.com/quinnovator/contactd/internal/turn
              desc: the client knows the API, not the turn loop
            - pkg: github.com/quinnovator/contactd/internal/plan
              desc: the client knows the API, not the planner
            - pkg: github.com/quinnovator/contactd/internal/recall
              desc: the client knows the API, not recall
            - pkg: github.com/quinnovator/contactd/internal/llm
              desc: the client never calls a model
            - pkg: github.com/quinnovator/contactd/internal/infer
              desc: the client never runs inference
            - pkg: github.com/quinnovator/contactd/internal/env
              desc: the client never runs code
            - pkg: github.com/quinnovator/contactd/internal/api
              desc: nothing imports the API layer
            - pkg: github.com/quinnovator/contactd/internal/config
              desc: the client takes its own options; cmd/contactd maps flags onto them
        # Inside the terminal client, four more lines. The packages that hold
        # its rules (what a terminal can do, the files it reads, the commands,
        # the status line, the mods, the pictures) draw nothing: they are
        # tested without a screen, and the screens are built on them. depguard
        # matches by prefix, so charm.land covers every package under it.
        tui-leaves-draw-nothing:
          files:
            - "**/internal/tui/safe/**"
            - "**/internal/tui/termcaps/**"
            - "**/internal/tui/toml/**"
            - "**/internal/tui/conf/**"
            - "**/internal/tui/scrollback/**"
            - "**/internal/tui/markdown/**"
            - "**/internal/tui/commands/**"
            - "**/internal/tui/statusline/**"
            - "**/internal/tui/mods/**"
            - "**/internal/tui/termimg/**"
            - "**/internal/tui/script/**"
            - "**/internal/tui/speech/**"
            - "**/internal/tui/motion/**"
            - "**/internal/tui/sound/**"
            - "**/internal/tui/canvas/**"
            - "**/internal/tui/avatar/**"
            - "!$test"
          deny:
            - pkg: charm.land
              desc: this package holds rules, not screens; drawing belongs to theme, draw and the screen packages
        # The avatar's voice reaches an audio device in one place, which the
        # command opens and the interface is handed.
        only-sound-plays:
          files:
            - "**/internal/tui/**"
            - "!**/internal/tui/sound/**"
          deny:
            - pkg: github.com/ebitengine/oto
              desc: the audio device is opened by internal/tui/sound; everything else is handed a Synth
        # A mod runs in one place, behind one set of limits.
        only-mods-run-wasm:
          files:
            - "**/internal/tui/**"
            - "!**/internal/tui/mods/**"
          deny:
            - pkg: github.com/tetratelabs/wazero
              desc: a mod is run by internal/tui/mods, which holds its sandbox and its budget
        # The library under Bubble Tea is an unreleased version. What the
        # client takes from it is the terminal's answers, in one file.
        only-probe-knows-ultraviolet:
          files:
            - "**/internal/tui/**"
            - "!**/internal/tui/probe.go"
            - "!$test"
          deny:
            - pkg: github.com/charmbracelet/ultraviolet
              desc: only probe.go reads the terminal library's own events; the rest goes through Bubble Tea
        # The API serves a contact's files through a port. What opens them is
        # handed in by cmd/contactd.
        api-knows-ports:
          files:
            - "**/internal/api/*.go"
            - "!$test"
          deny:
            - pkg: github.com/quinnovator/contactd/internal/env
              desc: the API reaches a contact's files through its Files port; cmd/contactd wires the adapter in
        # The reducer is values in, values out: no I/O and no clock.
        transcript-is-pure:
          files:
            - "**/internal/transcript/**"
            - "!$test"
          deny:
            - pkg: net
              desc: the reducer does no I/O
            - pkg: os
              desc: the reducer does no I/O
            - pkg: time
              desc: the reducer reads no clock; a caller passes the time in
            - pkg: github.com/quinnovator/contactd/internal/client
              desc: the reducer takes events and deltas, from wherever
            - pkg: charm.land
              desc: the reducer draws nothing
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use log/slog
        - pattern: ^log\.
          msg: use log/slog
        - pattern: ^time\.Now$
          msg: plan is pure; pass now in
        - pattern: ^rand\.
          msg: plan is deterministic
    sloglint:
      no-global: all
      static-msg: true
      key-naming-case: snake
    exhaustive:
      default-signifies-exhaustive: false
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    rules:
      # time.Now / rand are banned only inside plan. The match is on the
      # rule's message, since the reported expression may be a method on a
      # *rand.Rand value rather than the package name.
      - path-except: internal/plan/
        text: "plan is (pure|deterministic)"
        linters: [forbidigo]
      # Prometheus collectors are the one allowed global
      - path: internal/obs/
        linters: [gochecknoglobals]
      - path: _test\.go
        linters: [wrapcheck, gosec]
